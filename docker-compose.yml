# 个人健康长寿多智能体系统 - Docker Compose 开发环境配置
# Health Longevity Multi-Agent System - Docker Compose Development Configuration

version: '3.8'

services:
  # ===================
  # 后端服务
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-longevity-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      # ChromaDB 配置
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      # Neo4j 配置
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      # OpenAI 配置 (从 .env 文件读取)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    depends_on:
      - neo4j
      - chromadb
    networks:
      - health-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================
  # 前端服务
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health-longevity-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - health-network

  # ===================
  # ChromaDB 向量数据库
  # ===================
  chromadb:
    image: chromadb/chroma:latest
    container_name: health-longevity-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - health-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # Neo4j 图数据库
  # ===================
  neo4j:
    image: neo4j:5.15-community
    container_name: health-longevity-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - health-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ===================
# 网络配置
# ===================
networks:
  health-network:
    driver: bridge

# ===================
# 持久化卷配置
# ===================
volumes:
  backend-data:
    driver: local
  chromadb-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
