# Lefthook configuration for healthGuardian
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    # Frontend checks
    frontend-biome:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx,json}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}

    frontend-eslint:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm eslint --max-warnings=0 {staged_files}

    frontend-typecheck:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm tsc --noEmit

    # Backend checks
    backend-ruff:
      root: "backend/"
      glob: "*.py"
      run: poetry run ruff check {staged_files}

    # Note: mypy is skipped in pre-commit due to venv/Python version mismatch
    # Run manually with: cd backend && poetry run mypy app/

pre-push:
  parallel: false
  commands:
    # Run tests before push (more time-consuming)
    frontend-build:
      root: "frontend/"
      run: pnpm build

    backend-tests:
      root: "backend/"
      # 跳过需要 LLM 连接或外部服务的集成测试，只运行纯单元测试
      run: poetry run pytest tests/ -x --tb=short -m "not integration" --ignore=tests/agents/test_neuropsychology.py --ignore=tests/agents/test_nutrition.py --ignore=tests/agents/test_rehabilitation.py --ignore=tests/agents/test_synthesis.py --ignore=tests/test_chat_api.py --ignore=tests/test_confirm_api.py --ignore=tests/test_markdown_rag.py --ignore=tests/test_graph_rag.py --ignore=tests/test_user_profile_service.py
