# Lefthook configuration for healthGuardian
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    # Frontend checks
    frontend-biome:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx,json}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}

    frontend-eslint:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm eslint --max-warnings=0 {staged_files}

    frontend-typecheck:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm tsc --noEmit

    # Backend checks
    backend-ruff:
      root: "backend/"
      glob: "*.py"
      run: poetry run ruff check {staged_files}

    # Note: mypy is skipped in pre-commit due to venv/Python version mismatch
    # Run manually with: cd backend && poetry run mypy app/

pre-push:
  parallel: false
  commands:
    # Run tests before push (more time-consuming)
    frontend-build:
      root: "frontend/"
      run: pnpm build

    backend-tests:
      root: "backend/"
      run: poetry run pytest tests/ -x --tb=short
